# Two jobs:
#   - `check`: fast single-platform smoke test (Linux cargo check + vite
#     build). Runs on PRs and main pushes so a broken Rust/TS change is
#     caught in seconds.
#   - `windows-nsis-preview`: builds the Windows NSIS installer (.exe) on
#     every main push and uploads it as an artifact, so we can install +
#     test a build without cutting a release tag. Only the NSIS bundle is
#     built (--bundles nsis), skipping the MSI/WiX path entirely - faster
#     and avoids WiX flakiness. Skipped on PRs to keep PR CI fast.
#
# Cross-platform release builds + actual GitHub Release publication still
# live in release.yml (tag-triggered).

name: Check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file pkg-config

      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  windows-nsis-preview:
    # Main pushes only — PR builds skip the ~12-minute Windows compile.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      # cache-targets: false skips src-tauri/target (4-8 GB of
      # compiled artifacts) and only caches cargo registry + git
      # deps (~800 MB). The full target cache was overflowing
      # GitHub's 10 GB per-cache limit AND OOM-killing tar/zstd
      # mid-compression on the 14 GB Windows runner - the action's
      # post-step exited silently because zstd was SIGKILL'd by
      # the OS, masking the real cause. Trade-off: ~5 min slower
      # build (deps recompile from source) for stable CI. The
      # produced installer is byte-identical either way.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-targets: false

      - run: npm ci

      # tauri.conf.json has createUpdaterArtifacts: true so the tag-
      # triggered release.yml signs releases for the updater. check.yml
      # doesn't have signing secrets (those exist only on tag pushes),
      # so we override that flag to false for the preview build —
      # otherwise tauri-bundler errors with "public key found, no
      # private key" right after the installer is bundled.
      #
      # --bundles nsis: build ONLY the NSIS installer (.exe), not the MSI.
      # That's the format we install + test from, and it skips the WiX
      # path entirely (faster, no WiX/light.exe flakiness).
      - name: Build NSIS installer (no updater signing for preview)
        shell: pwsh
        run: |
          @'
          {"bundle":{"createUpdaterArtifacts":false}}
          '@ | Set-Content -Path build-override.json
          npm run tauri build -- --config build-override.json --bundles nsis

      - name: Upload NSIS installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: defrag-launcher-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
