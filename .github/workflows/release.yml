# Build and publish the launcher for Windows, macOS (Intel + Apple Silicon)
# and Linux whenever a `launcher-v*` tag is pushed. Each platform matrix job
# uploads its installer to the matching draft GitHub Release; after all
# platforms finish the release is published automatically.
#
# Triggering: `git tag launcher-v0.1.0 && git push --tags`.
# The `launcher-` prefix keeps the tag namespace clean in case this repo
# later grows other taggable artifacts.

name: Release launcher

on:
  push:
    tags:
      - 'launcher-v*'
  # Manual trigger so we can kick a build for a given tag without
  # re-pushing. `tag` input lets us pick an existing tag from the repo.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'      # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'      # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Apple Silicon target only available on macos-latest runners but
          # must be installed explicitly since `stable` defaults to x86.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file pkg-config

      - name: Install npm deps
        run: npm ci

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing creds for tauri-plugin-updater. tauri-action passes
          # these to the bundler which signs the platform artifact and
          # emits `latest.json` alongside it. Keep both secrets set — a
          # missing password makes the bundler skip signing silently
          # and the resulting release won't auto-update for anyone.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Defrag Racing Launcher ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            - **Windows**: `.msi` or `.exe` installer
            - **macOS**: `.dmg` (pick Apple Silicon for M1/M2/M3 Macs, Intel for older ones)
            - **Linux**: `.AppImage` (portable) or `.deb`

            Tauri updater will pick up future releases automatically once you have v0.1.0+ installed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Diagnostic step: tauri-action swallows light.exe stderr, so when the
      # MSI bundle step fails we re-run candle + light manually with -v to
      # surface the actual WiX error.
      - name: Diagnose WiX light.exe failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        continue-on-error: true
        run: |
          $wix = "$env:LOCALAPPDATA\tauri\WixTools314"
          Write-Host "=== WiX tools: $wix ==="
          if (-not (Test-Path $wix)) {
            Write-Host "WiX tools dir not found."
            exit 0
          }
          Get-ChildItem $wix | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host

          $main = "target\release\wix\x64\main.wxs"
          $frag = "wix\cleanup.wxs"
          $outDir = "target\release\wix\debug"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Write-Host "=== main.wxs exists: $(Test-Path $main) ==="
          Write-Host "=== cleanup.wxs exists: $(Test-Path $frag) ==="

          Write-Host "`n=== candle main.wxs ==="
          & "$wix\candle.exe" -arch x64 -out "$outDir\main.wixobj" $main
          Write-Host "candle main exit: $LASTEXITCODE"

          Write-Host "`n=== candle cleanup.wxs ==="
          & "$wix\candle.exe" -arch x64 -out "$outDir\cleanup.wixobj" $frag
          Write-Host "candle cleanup exit: $LASTEXITCODE"

          Write-Host "`n=== light -v (verbose, validation on) ==="
          & "$wix\light.exe" -v -ext WixUtilExtension -ext WixUIExtension -cultures:en-US `
            -out "$outDir\debug.msi" "$outDir\main.wixobj" "$outDir\cleanup.wixobj"
          Write-Host "`n=== light exit: $LASTEXITCODE ==="

          Write-Host "`n=== light -v -sval (skip ICE validation, to isolate real errors) ==="
          & "$wix\light.exe" -v -sval -ext WixUtilExtension -ext WixUIExtension -cultures:en-US `
            -out "$outDir\debug-sval.msi" "$outDir\main.wixobj" "$outDir\cleanup.wixobj"
          Write-Host "`n=== light -sval exit: $LASTEXITCODE ==="
