# Build and publish the launcher for Windows, macOS (Intel + Apple Silicon)
# and Linux whenever a `launcher-v*` tag is pushed.
#
# Architecture (per tauri-apps/tauri-action#914 race-condition workaround):
#   1. `create-release` runs FIRST and creates the draft GH release exactly
#      once, exposing its release_id as an output.
#   2. `build` is a 4-job matrix that `needs: create-release` and passes
#      that release_id into tauri-action via the `releaseId` input, which
#      switches the action into upload-only mode (no listReleases TOCTOU,
#      no second draft can ever be created).
#   3. `publish` runs after the matrix and flips the draft to published
#      via gh CLI, so we never leave releases lingering as drafts. If any
#      matrix job failed, the release stays a draft for manual recovery.
#
# Why the previous single-job matrix broke: each job called tauri-action
# with `releaseDraft: true` and the same tagName. The action paginates
# listReleases to find an existing draft, and "draft not found" → create
# one. With 4 jobs racing, two of them could simultaneously hit the
# not-found path and both POST createRelease, producing duplicate drafts
# with identical tags; assets scattered between them.
#
# Triggering: `git tag launcher-v0.1.0 && git push --follow-tags`.
# The `launcher-` prefix keeps the tag namespace clean.

name: Release launcher

on:
  push:
    tags:
      - 'launcher-v*'
  # Manual trigger so we can kick a build for a given tag without
  # re-pushing. `tag` input lets us pick an existing tag from the repo.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag + extract changelog section
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#launcher-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Slice the matching `## X.Y.Z` section from CHANGELOG.md so the
          # GitHub release body carries the one-version notes. The
          # launcher's in-app "What's new" panel fetches CHANGELOG.md
          # directly and stacks every section newer than the user's
          # installed version, so users on old builds still see the full
          # diff - this body just covers what the GH release page shows.
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## " ver "([^0-9]|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$SECTION" | tr -d "[:space:]")" ]; then
            SECTION="Release ${VERSION}. See https://github.com/Defrag-racing/defrag-racing-launcher/blob/main/CHANGELOG.md for the full changelog."
          fi
          {
            echo "body<<DRL_EOF"
            echo "$SECTION"
            echo ""
            echo "---"
            echo ""
            echo "Download the installer for your platform below."
            echo ""
            echo "- **Windows**: \`.exe\` installer (per-user - no admin prompt, updates apply silently)"
            echo "- **macOS**: \`.dmg\` (pick Apple Silicon for M1/M2/M3 Macs, Intel for older ones)"
            echo "- **Linux**: \`.AppImage\` (portable) or \`.deb\`"
            echo ""
            echo "The launcher's auto-updater will pick this up automatically on v0.1.0+ installs."
            echo "DRL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          BODY: ${{ steps.meta.outputs.body }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              name: `Defrag Racing Launcher ${process.env.TAG}`,
              body: process.env.BODY,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'      # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'      # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            # NSIS only: it installs per-user (currentUser), so the
            # auto-updater never needs admin/UAC. The MSI (WiX) is
            # per-machine, which forced a UAC prompt on every update that
            # the updater-spawned installer couldn't even bring to the
            # foreground - it just blinked in the taskbar.
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Apple Silicon target only available on macos-latest runners but
          # must be installed explicitly since `stable` defaults to x86.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        # cache-targets: false skips src-tauri/target (4-8 GB of
        # compiled artifacts) and only caches cargo registry + git
        # deps. Full target cache was overflowing GH's 10 GB cache
        # limit AND OOM-killing zstd mid-compression on Windows
        # runners. Trade-off: +5 min build time, byte-identical
        # binary output (release-mode cargo is deterministic).
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-targets: false

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2 so the AppImage tooling (linuxdeploy) can FUSE-mount; the
          # APPIMAGE_EXTRACT_AND_RUN env below also lets it run without FUSE, but
          # installing it too is cheap insurance against the runner image dropping
          # FUSE entirely.
          # libsdl2-2.0-0: the bundled demo-player engine (resources/odfe/oDFe.x64)
          # links libSDL2; linuxdeploy scans it while building the AppImage and
          # fails ("failed to run linuxdeploy") if SDL2 isn't present to resolve.
          # Installing it also lets linuxdeploy bundle SDL2 into the AppImage so
          # the player works on machines without it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential curl wget file pkg-config libfuse2 libsdl2-2.0-0

      - name: Install npm deps
        run: npm ci

      - name: Build + upload to existing draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage bundling: linuxdeploy (and its plugins) are themselves
          # AppImages and need FUSE to mount-and-run. The ubuntu-22.04 runner
          # image no longer ships libfuse2, so they fail with the opaque
          # "failed to run linuxdeploy". This makes every AppImage tool extract
          # itself and run instead of FUSE-mounting. Ignored on Windows/macOS.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Signing creds for tauri-plugin-updater. tauri-action passes
          # these to the bundler which signs the platform artifact and
          # emits `latest.json` alongside it. Keep both secrets set — a
          # missing password makes the bundler skip signing silently
          # and the resulting release won't auto-update for anyone.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # releaseId switches tauri-action into upload-only mode: no
          # listReleases/createRelease pair, so the 4 parallel matrix jobs
          # cannot race each other into duplicate drafts (see #914).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Diagnostic step: tauri-action swallows light.exe stderr, so when the
      # MSI bundle step fails we re-run candle + light manually with -v to
      # surface the actual WiX error.
      - name: Diagnose WiX light.exe failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        continue-on-error: true
        run: |
          $wix = "$env:LOCALAPPDATA\tauri\WixTools314"
          Write-Host "=== WiX tools: $wix ==="
          if (-not (Test-Path $wix)) {
            Write-Host "WiX tools dir not found."
            exit 0
          }
          Get-ChildItem $wix | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host

          $main = "target\release\wix\x64\main.wxs"
          $frag = "wix\cleanup.wxs"
          $outDir = "target\release\wix\debug"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Write-Host "=== main.wxs exists: $(Test-Path $main) ==="
          Write-Host "=== cleanup.wxs exists: $(Test-Path $frag) ==="

          Write-Host "`n=== candle main.wxs ==="
          & "$wix\candle.exe" -arch x64 -out "$outDir\main.wixobj" $main
          Write-Host "candle main exit: $LASTEXITCODE"

          Write-Host "`n=== candle cleanup.wxs ==="
          & "$wix\candle.exe" -arch x64 -out "$outDir\cleanup.wixobj" $frag
          Write-Host "candle cleanup exit: $LASTEXITCODE"

          Write-Host "`n=== light -v (verbose, validation on) ==="
          & "$wix\light.exe" -v -ext WixUtilExtension -ext WixUIExtension -cultures:en-US `
            -out "$outDir\debug.msi" "$outDir\main.wixobj" "$outDir\cleanup.wixobj"
          Write-Host "`n=== light exit: $LASTEXITCODE ==="

          Write-Host "`n=== light -v -sval (skip ICE validation, to isolate real errors) ==="
          & "$wix\light.exe" -v -sval -ext WixUtilExtension -ext WixUIExtension -cultures:en-US `
            -out "$outDir\debug-sval.msi" "$outDir\main.wixobj" "$outDir\cleanup.wixobj"
          Write-Host "`n=== light -sval exit: $LASTEXITCODE ==="

  publish:
    # Auto-flip the draft to published once all 4 matrix jobs succeeded.
    # If any matrix job failed, this step is skipped and the release stays
    # a draft for manual inspection / cleanup. Removes the "remember to
    # click Publish" step from the human release flow.
    needs: [create-release, build]
    if: success()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api -X PATCH "/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -f draft=false \
            -f make_latest=true
