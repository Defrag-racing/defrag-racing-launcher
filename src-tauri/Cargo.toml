[package]
name = "defrag-launcher"
version = "0.1.12"
description = "Demo backup + defrag:// launcher for defrag.racing"
authors = ["defrag.racing"]
edition = "2021"

[lib]
name = "defrag_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

# defrag:// deep links. deep-link registers the URL scheme with the OS
# and forwards incoming links to the running app. single-instance is
# the companion plugin: when the user clicks a defrag:// link while the
# launcher is already open, the OS spawns a new exe but single-instance
# hands the args off to the original process and exits the new one —
# without it every click would spawn a second launcher window.
tauri-plugin-deep-link = "2"

# Auto-update: pulls signed `latest.json` from defrag.racing (primary)
# or GitHub Releases (fallback) and verifies the signature against the
# embedded pubkey before installing. Private signing key lives in GH
# Actions secrets — see release.yml.
tauri-plugin-updater = "2"

# process: gives the frontend a `relaunch()` JS call for use after an
# update finishes installing. Without this, the only way to restart
# the app post-install is to close-and-reopen manually.
tauri-plugin-process = "2"

# Autostart on user login. Used so the launcher can live in the tray
# from boot, keeping the demo watcher + defrag:// handler responsive
# without the user having to open it manually after every reboot.
# Default OFF in our Settings — opt-in.
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# Async runtime + HTTP client for talking to defrag.racing.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "stream"] }

# OS keyring — stores the launcher token securely (Windows Credential
# Manager / macOS Keychain / libsecret on Linux) so we never write it to
# disk in plaintext.
keyring = "3"

# Filesystem watcher for auto-upload of new demos. debouncer collapses the
# bursts of events while Defrag is still writing the file.
notify = "6"
notify-debouncer-full = "0.3"

# MD5 of demo files for dedup lookup against the server before uploading.
md-5 = "0.10"
hex = "0.4"

# Cross-platform standard-directory lookup (Documents / AppData / etc.) —
# used for default install paths during engine detection.
directories = "5"
walkdir = "2"

# Base64 obfuscation for the on-disk token file. Not real encryption —
# just keeps the token from appearing verbatim in casual filesystem scans.
base64 = "0.22"

# Simple logging for dev + bug reports from users. tauri-plugin-log would
# be fancier but adds bundle size we don't need yet.
log = "0.4"
env_logger = "0.11"

# Windows-only: read Steam install path from the registry so engine
# auto-detect picks up Steam-installed Quake 3 without the user having to
# hunt for the path. Wrapped in cfg so Linux/Mac builds skip the dep.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# single-instance with deep-link forwarding — Windows + Linux only. macOS
# handles deep links via the native NSURL/AppleEvent path which doesn't
# go through process re-spawn, so single-instance isn't needed there.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
